<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PETER OS 3.0 — Fixed Lock Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
  
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#050508;
    --peter-purple:#8B5CF6;
    --os-bg:#0d0d15;
    --os-card:rgba(25, 25, 38, 0.85);
    --os-line:rgba(255,255,255,0.1);
    --muted:rgba(255,255,255,0.6);
  }
  
  html, body{ height:100vh; height:100dvh; overflow:hidden; position:fixed; width:100%; }
  body{
    font-family:'Kantumruy Pro','Outfit',sans-serif;
    background:var(--bg); color:#fff; display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color: transparent;
  }

  .phone-frame {
    position:relative; width:100%; max-width:390px; height:100vh; height:100dvh; max-height:815px;
    background:var(--os-bg); border:2px solid rgba(139,92,246,0.3);
    box-shadow: 0 50px 120px rgba(0,0,0,0.98), 0 0 50px rgba(139,92,246,0.15);
    display:flex; flex-direction:column; overflow:hidden; z-index:2;
  }

  @media(min-width:450px) {
    .phone-frame { border-radius:44px; height:795px; border:8px solid #14141f; }
  }

  /* LOCK SCREEN FIXED */
  .lock-screen {
    position: absolute; inset: 0; z-index: 400;
    background: linear-gradient(135deg, #2e1065 0%, #0f0728 100%);
    display: flex; flex-direction: column; justify-content: space-between; padding: 60px 24px 40px 24px;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
  }
  .lock-screen.unlocked { transform: translateY(-100%); opacity: 0; pointer-events: none; }

  .phone-notch {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 90px; height: 22px; background: #000; border-radius: 99px; z-index: 100;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px 4px 20px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.85); z-index: 50;
  }

  .screen-content { flex: 1; padding: 10px 16px 74px 16px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .os-header h1 { font-size: 26px; font-weight: 800; color: #fff; }
  .os-header p { font-size: 12px; color: var(--muted); }

  .os-widget {
    background: var(--os-card); border: 1px solid rgba(139,92,246,0.3); border-radius: 20px; padding: 14px; display: flex; align-items: center; justify-content: space-between; margin-top: 8px;
  }
  .widget-btn { background: var(--peter-purple); color: #fff; font-weight: 600; font-size: 11px; padding: 6px 14px; border-radius: 99px; cursor: pointer; border: none; }

  .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 8px; margin-top: 10px; }
  .app-item { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; color: #fff; font-family: inherit; }
  .app-icon { width: 54px; height: 54px; border-radius: 18px; background: rgba(255,255,255,0.06); border: 1px solid var(--os-line); display: grid; place-items: center; font-size: 22px; }

  .app-modal {
    position: absolute; inset: 0; background: rgba(13, 13, 21, 0.98); backdrop-filter: blur(20px);
    z-index: 200; padding: 16px; display: flex; flex-direction: column; opacity: 0; transform: scale(0.95); pointer-events: none; transition: all 0.25s ease;
  }
  .app-modal.open { opacity: 1; transform: scale(1); pointer-events: auto; }

  .phone-dock {
    position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(13, 13, 21, 0.9);
    border-top: 1px solid var(--os-line); padding: 6px 18px 18px 18px; display: flex; justify-content: space-around; align-items: center; z-index: 90;
  }
  .dock-icon { width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--os-line); display: grid; place-items: center; cursor: pointer; }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- LOCK SCREEN FIXED -->
  <div class="lock-screen" id="lockScreen">
    <div>
      <div style="font-size: 60px; font-weight: 300;" id="lockTime">12:45</div>
      <div style="font-size: 13px; color: var(--muted);" id="lockDate">Thursday, August 13</div>
    </div>
    <div style="text-align:center; background:var(--peter-purple); padding:14px 20px; border-radius:99px; cursor:pointer; font-weight:700; box-shadow:0 0 20px rgba(139,92,246,0.6);" onclick="unlockPhone()">
      🔓 ចុចទីនេះដើម្បីដោះសោទូរស័ព្ទ
    </div>
    <div style="display:flex; justify-content:space-between;">
      <button style="width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.1); border:none; color:#fff; cursor:pointer;" onclick="unlockPhone(); openApp('PeterAI');">🤖</button>
      <button style="width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.1); border:none; color:#fff; cursor:pointer;" onclick="unlockPhone(); openApp('XLfy');">🎧</button>
    </div>
  </div>

  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="statusBarClock">12:28</span>
    <span style="color:#A78BFA;">PETER OS 3.0 Live</span>
  </div>

  <div class="screen-content">
    <div>
      <div class="os-header">
        <h1>PETER OS</h1>
        <p>Live Cloud Edition (Build 3.0)</p>
      </div>

      <div class="os-widget">
        <div>
          <b style="font-size:13px; display:block;">Peter AI & XLfy Ready</b>
          <span style="font-size:11px; color:var(--muted);">ប្រព័ន្ធដំណើរការទូទាំងពិភពលោក</span>
        </div>
        <button class="widget-btn" onclick="openApp('PeterAI')">សាកល្បង AI</button>
      </div>

      <div style="font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:700; margin:14px 0 6px 4px;">កម្មវិធីទាំងអស់</div>
      <div class="app-grid">
        <button class="app-item" onclick="openApp('PeterAI')"><div class="app-icon" style="color:#A78BFA">🤖</div><span style="font-size:11px;">Peter AI</span></button>
        <button class="app-item" onclick="openApp('XLfy')"><div class="app-icon" style="color:#EC4899">🎧</div><span style="font-size:11px;">XLfy Music</span></button>
        <button class="app-item" onclick="openApp('Notes')"><div class="app-icon" style="color:#F59E0B">📝</div><span style="font-size:11px;">កត់ត្រា</span></button>
        <button class="app-item" onclick="openApp('Settings')"><div class="app-icon" style="color:#8B5CF6">⚙️</div><span style="font-size:11px;">ការកំណត់</span></button>
      </div>
    </div>
    <div style="text-align:center; font-size:9px; color:var(--muted);">✦ PETER OS Live Cloud Architecture</div>
  </div>

  <div class="app-modal" id="appModal">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--os-line); padding-bottom:10px; margin-bottom:12px;">
      <button style="background:rgba(255,255,255,0.08); border:none; color:#fff; padding:6px 12px; border-radius:10px; font-size:11px; cursor:pointer;" onclick="openApp('Home')">← ថយក្រោយ</button>
      <div style="font-size:15px; font-weight:700;" id="modalTitle">កម្មវិធី</div>
      <div style="width:40px"></div>
    </div>
    <div style="flex:1; overflow-y:auto;" id="modalBody"></div>
  </div>

  <div class="phone-dock">
    <div class="dock-icon" onclick="openApp('PeterAI')">🤖</div>
    <div class="dock-icon" onclick="openApp('Notes')">📝</div>
    <div class="dock-icon" onclick="openApp('XLfy')">🎧</div>
    <div class="dock-icon" onclick="openApp('Settings')">⚙️</div>
  </div>
</div>

<script>
  function unlockPhone() { 
    document.getElementById('lockScreen').classList.add('unlocked'); 
  }

  function updateTime() {
    const d = new Date();
    const timeStr = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    document.getElementById('statusBarClock').textContent = timeStr;
    document.getElementById('lockTime').textContent = timeStr;
  }
  setInterval(updateTime, 1000);
  updateTime();

  let notes = JSON.parse(localStorage.getItem('peter_notes') || '["ស្វាគមន៍មកកាន់ PETER OS 3.0 Live Cloud!"]');
  let chats = JSON.parse(localStorage.getItem('peter_chats') || '[{"sender":"bot","text":"សួស្តី! ខ្ញុំគឺ Peter AI ត្រៀមខ្លួនជួយអ្នកហើយ។"}]');

  function openApp(name) {
    unlockPhone();
    if(name === 'Home') { document.getElementById('appModal').classList.remove('open'); return; }

    const title = document.getElementById('modalTitle');
    const body = document.getElementById('modalBody');

    if(name === 'PeterAI') {
      title.textContent = 'Peter AI 🤖';
      let html = chats.map(c => `<div style="padding:8px 12px; margin-bottom:6px; border-radius:10px; font-size:12px; max-width:85%; ${c.sender==='user'?'background:#8B5CF6;margin-left:auto':'background:rgba(139,92,246,0.2)'}">${c.text}</div>`).join('');
      body.innerHTML = `<div style="display:flex;flex-direction:column;height:100%;"><div style="flex:1;overflow-y:auto;margin-bottom:10px;" id="chatBox">${html}</div><div style="display:flex;gap:6px;"><input type="text" id="aiInput" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--os-line);border-radius:10px;padding:8px;color:#fff;outline:none;font-size:12px;" placeholder="សួរសំណួរ..."><button style="background:var(--peter-purple);border:none;color:#fff;padding:0 14px;border-radius:10px;cursor:pointer;font-weight:700;" onclick="sendAI()">ផ្ញើ</button></div></div>`;
    } else if(name === 'XLfy') {
      title.textContent = 'XLfy Music 🎧';
      body.innerHTML = `<div style="text-align:center;padding:30px;"><div style="font-size:50px;margin-bottom:10px;">🎵</div><h3>Cyber Neon Streamer</h3><p style="color:var(--muted);font-size:11px;margin-top:6px;">PETER OS Official Audio Engine</p></div>`;
    } else if(name === 'Notes') {
      title.textContent = 'Notes 📝';
      let nHtml = notes.map(n => `<div style="background:rgba(255,255,255,0.04);padding:8px;border-radius:8px;margin-bottom:6px;font-size:12px;">📌 ${n}</div>`).join('');
      body.innerHTML = `<div><textarea id="noteTxt" style="width:100%;height:90px;background:rgba(255,255,255,0.05);border:1px solid var(--os-line);border-radius:10px;color:#fff;padding:8px;font-size:12px;outline:none;resize:none;" placeholder="សរសេរកំណត់ត្រា..."></textarea><button style="background:var(--peter-purple);border:none;color:#fff;width:100%;padding:8px;border-radius:10px;font-weight:700;margin-top:6px;cursor:pointer;" onclick="saveNote()">រក្សាទុក</button><div style="margin-top:10px;">${nHtml}</div></div>`;
    } else if(name === 'Settings') {
      title.textContent = 'Settings ⚙️';
      body.innerHTML = `<div style="background:rgba(255,255,255,0.04);padding:12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;"><span>System Version</span><span style="color:#10B981;font-weight:700;">PETER OS 3.0 Live</span></div>`;
    }
    document.getElementById('appModal').classList.add('open');
  }

  function sendAI() {
    const input = document.getElementById('aiInput');
    if(input.value.trim() !== '') {
      chats.push({sender:'user', text:input.value});
      setTimeout(() => {
        chats.push({sender:'bot', text:'PETER OS 3.0 Cloud ឆ្លើយតបយ៉ាងរលូន!'});
        localStorage.setItem('peter_chats', JSON.stringify(chats));
        openApp('PeterAI');
      }, 600);
      localStorage.setItem('peter_chats', JSON.stringify(chats));
      openApp('PeterAI');
    }
  }

  function saveNote() {
    const t = document.getElementById('noteTxt');
    if(t.value.trim() !== '') {
      notes.unshift(t.value);
      localStorage.setItem('peter_notes', JSON.stringify(notes));
      openApp('Notes');
    }
  }
</script>
</body>
</html>
